name: Android build (arm64 only)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        project:
          - LiquidGlassClickGUI
          - LiquidPE
          - MD3-ClickGui-NextGen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build arm64-v8a debug APK
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Dorg.gradle.java.installations.auto-download=false \
            -Pandroid.injected.abi.filters=arm64-v8a \
            :app:assembleDebug

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-arm64-debug
          path: |
            ${{ matrix.project }}/app/build/outputs/apk/**/*arm64*.apk
            ${{ matrix.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
